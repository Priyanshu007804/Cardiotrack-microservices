spring.application.name=doctor-service

server.port=${SERVER_PORT:8083}

# Database Configuration with Environment Variables and safe local fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardiotrack_doctor}
spring.datasource.username=${DB_USERNAME:docter_service_user}
spring.datasource.password=${DB_PASSWORD:doctor@cardiotrack}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Configuration with Environment Variables and safe defaults
jwt.secret=${JWT_SECRET:sjydtrdiyckhgxrxtrkfvkhcdjrtydyuctfluyfkuyfkuyktycdytdckychbkjvh}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# External Services
services.patient-service.url=${PATIENT_SERVICE_URL:http://PATIENT-SERVICE}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}

spring.application.name=patient-service

server.port=${SERVER_PORT:8082}

# Database Configuration with Environment Variables and safe local fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardiotrack_patient}
spring.datasource.username=${DB_USERNAME:cardiotrack_patient_user}
spring.datasource.password=${DB_PASSWORD:patient@cardiotrack}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Configuration with Environment Variables and safe defaults
jwt.secret=${JWT_SECRET:sjydtrdiyckhgxrxtrkfvkhcdjrtydyuctfluyfkuyfkuyktycdytdckychbkjvh}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topics.patient-registered=${PATIENT_REGISTERED_TOPIC:patient.registered}

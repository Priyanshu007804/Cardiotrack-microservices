spring.application.name=report-service

server.port=${SERVER_PORT:8085}

# Database Configuration with Environment Variables and safe local fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardiotrack_reports}
spring.datasource.username=${DB_USERNAME:reports_service_user}
spring.datasource.password=${DB_PASSWORD:reports@cardiotrack}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Configuration with Environment Variables and safe defaults
jwt.secret=${JWT_SECRET:sjydtrdiyckhgxrxtrkfvkhcdjrtydyuctfluyfkuyfkuyktycdytdckychbkjvh}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# External Services
services.patient-service.url=${PATIENT_SERVICE_URL:http://PATIENT-SERVICE}
services.doctor-service.url=${DOCTOR_SERVICE_URL:http://DOCTOR-SERVICE}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB